# Blueprint de Render: https://render.com/docs/blueprint-spec
# Deploy nativo (sin Docker). La base de datos vive en Neon.
# Dashboard: New → Blueprint → conectar este repo
# o New → Web Service con Build/Start commands de abajo.

services:
  - type: web
    name: cnb-backend
    runtime: native
    plan: free
    buildCommand: composer install --no-dev --optimize-autoloader --no-interaction
    startCommand: php -S 0.0.0.0:$PORT -t public public/router.php
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_DEBUG
        value: "0"
      - key: APP_SECRET
        generateValue: true
      - key: DEFAULT_URI
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
